name: Standalone binaries
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x64, linux-arm64, darwin-arm64, darwin-x64, windows-x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # Block on high-severity production advisories; report dev advisories separately.
      - run: bun audit --prod --audit-level high
      - name: Report all dependency advisories (including dev dependencies)
        run: bun audit --audit-level high
        continue-on-error: true
      - run: bun run build
      - name: Compile embedded assets and migrations
        run: bun scripts/build-binary.ts bun-${{ matrix.target }}
      - name: Smoke local binary from a clean directory
        if: matrix.target == 'linux-x64'
        run: bun scripts/smoke-cli.ts dist/mcp-studio-linux-x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-studio-${{ matrix.target }}
          path: dist/mcp-studio-${{ matrix.target }}*
          if-no-files-found: error

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mcp-studio-*
          path: binaries
          merge-multiple: true
      - name: Generate release checksums
        working-directory: binaries
        run: sha256sum mcp-studio-* > SHA256SUMS
      - name: Refuse to modify a published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$draft" = true || { echo 'Release already published'; exit 1; }
          fi
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          files: binaries/*
          fail_on_unmatched_files: true
