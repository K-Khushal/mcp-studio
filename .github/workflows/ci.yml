name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # Block on high-severity production advisories; report dev advisories separately.
      - run: bun audit --prod --audit-level high
      - name: Report all dependency advisories (including dev dependencies)
        run: bun audit --audit-level high
        continue-on-error: true
      - run: bun typecheck
      - run: bun lint
      - run: bun run test
      - run: bun run build
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      # Block on high-severity production advisories; report dev advisories separately.
      - run: bun audit --prod --audit-level high
      - name: Report all dependency advisories (including dev dependencies)
        run: bun audit --audit-level high
        continue-on-error: true
      - run: bun --cwd e2e playwright install --with-deps chromium
      - run: bun run e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-failure
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
