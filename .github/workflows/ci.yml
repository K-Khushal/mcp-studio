name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # Block on high-severity production advisories; report dev advisories separately.
      - run: bun audit --prod --audit-level high
      - name: Report all dependency advisories (including dev dependencies)
        run: bun audit --audit-level high
        continue-on-error: true
      - run: bun typecheck
      - run: bun lint
      - run: bun run test
      - run: bun run build
